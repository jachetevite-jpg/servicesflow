<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil - ServiceFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-wrapper">
    <div class="page-header">
      <h1>Mon Profil</h1>
      <p class="text-muted">Gérez vos informations personnelles et votre sécurité.</p>
    </div>

    <!-- Section Informations Personnelles -->
    <div class="card">
      <h3>Informations personnelles</h3>
      <div id="profile-alert" class="alert hidden"></div>

      <form id="user-profile-form">
        <div class="form-row">
          <div class="form-group">
            <label for="profile-firstname">Prénom</label>
            <input type="text" id="profile-firstname" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="profile-lastname">Nom</label>
            <input type="text" id="profile-lastname" class="form-control" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="profile-email">Email (Non modifiable)</label>
            <input type="email" id="profile-email" class="form-control" disabled>
          </div>
          <div class="form-group">
            <label for="profile-phone">Téléphone</label>
            <input type="tel" id="profile-phone" class="form-control">
          </div>
        </div>

        <div class="form-group">
          <label for="profile-role">Rôle actuel</label>
          <input type="text" id="profile-role" class="form-control" disabled>
        </div>

        <button type="submit" id="btn-save-profile" class="btn btn-primary">
          Mettre à jour le profil
        </button>
      </form>
    </div>

    <!-- Section Sécurité / Mot de passe -->
    <div class="card" style="margin-top: 1.5rem;">
      <h3>Sécurité & Mot de passe</h3>
      <div id="password-alert" class="alert hidden"></div>

      <form id="change-password-form">
        <div class="form-group">
          <label for="old-password">Mot de passe actuel</label>
          <input type="password" id="old-password" class="form-control" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="new-password">Nouveau mot de passe</label>
            <input type="password" id="new-password" class="form-control" required minlength="8">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmer le nouveau mot de passe</label>
            <input type="password" id="confirm-password" class="form-control" required minlength="8">
          </div>
        </div>

        <button type="submit" id="btn-save-password" class="btn btn-secondary">
          Changer le mot de passe
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
