<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié - ServiceFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo" style="justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          ServiceFlow
        </div>
        <h2>Réinitialisation de mot de passe</h2>
        <p>Saisissez votre email pour recevoir les instructions</p>
      </div>

      <div id="alert-container"></div>

      <form id="forgot-password-form">
        <div class="form-group">
          <label for="email">Adresse Email</label>
          <input type="email" id="email" class="form-control" placeholder="nom@entreprise.com" required>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%;">
          Envoyer le lien de réinitialisation
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html">← Retour à la page de connexion</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
