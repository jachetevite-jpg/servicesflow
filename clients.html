<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients - ServicesFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>ServicesFlow</h2>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html">Tableau de bord</a>
        <a href="clients.html" class="active">Clients</a>
        <a href="complaints.html">Réclamations</a>
        <a href="interventions.html">Interventions</a>
        <a href="notifications.html">Notifications</a>
        <a href="activity-logs.html">Journal d'activité</a>
      </nav>
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-danger btn-block">Déconnexion</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Gestion des Clients</h1>
        <button id="btn-refresh-clients" class="btn btn-secondary">Actualiser</button>
      </header>

      <section class="section-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nom / Raison Sociale</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Adresse</th>
                <th>Date d'ajout</th>
              </tr>
            </thead>
            <tbody id="clients-table-body">
              <tr><td colspan="5">Chargement des clients...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/clients.js"></script>
</body>
</html>
