<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients - ServiceFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>ServiceFlow</h2>
        <span id="company-display-name" style="font-size:0.75rem; color:#94a3b8;">Chargement...</span>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html">Tableau de bord</a>
        <a href="clients.html" class="active">Clients</a>
        <a href="complaints.html">Réclamations</a>
        <a href="interventions.html">Interventions</a>
        <a href="technicians.html">Techniciens</a>
        <a href="notifications.html">Notifications</a>
        <a href="settings.html">Paramètres</a>
      </nav>
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-danger btn-block">Déconnexion</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Gestion des Clients</h1>
        <button id="btn-open-create-client" class="btn btn-primary">+ Nouveau Client</button>
      </header>

      <section class="section-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nom</th>
                <th>Entreprise</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Ville</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="clients-table-body">
              <tr><td colspan="6">Chargement...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-client" class="modal-backdrop" style="display:none;">
    <div class="modal-content">
      <h2>Nouveau Client</h2>
      <form id="form-client" style="margin-top:1rem;">
        <div class="form-group"><label>Prénom</label><input type="text" id="c-firstName" required></div>
        <div class="form-group"><label>Nom</label><input type="text" id="c-lastName" required></div>
        <div class="form-group"><label>Entreprise</label><input type="text" id="c-companyName"></div>
        <div class="form-group"><label>Email</label><input type="email" id="c-email" required></div>
        <div class="form-group"><label>Téléphone</label><input type="tel" id="c-phone"></div>
        <div class="form-group"><label>Adresse</label><input type="text" id="c-address"></div>
        <div class="form-group"><label>Ville</label><input type="text" id="c-city"></div>
        <div class="form-group"><label>Notes</label><textarea id="c-notes"></textarea></div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:1rem;">
          <button type="button" id="btn-close-modal" class="btn btn-secondary">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/clients.js"></script>
</body>
</html>
