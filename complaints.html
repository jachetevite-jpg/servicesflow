<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réclamations - ServiceFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>ServiceFlow</h2>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html">Tableau de bord</a>
        <a href="clients.html">Clients</a>
        <a href="complaints.html" class="active">Réclamations</a>
        <a href="interventions.html">Interventions</a>
        <a href="technicians.html">Techniciens</a>
        <a href="notifications.html">Notifications</a>
        <a href="settings.html">Paramètres</a>
      </nav>
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-danger btn-block">Déconnexion</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Gestion des Réclamations</h1>
        <button id="btn-open-modal-complaint" class="btn btn-primary">+ Nouvelle Réclamation</button>
      </header>

      <section class="section-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Référence</th>
                <th>Titre</th>
                <th>Catégorie</th>
                <th>Priorité</th>
                <th>Statut</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="complaints-table-body">
              <tr><td colspan="7">Chargement...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-complaint" class="modal-backdrop" style="display:none;">
    <div class="modal-content">
      <h2>Nouvelle Réclamation</h2>
      <form id="form-complaint" style="margin-top:1rem;">
        <div class="form-group">
          <label>Client</label>
          <select id="cmp-clientId" required><option value="">Sélectionner un client...</option></select>
        </div>
        <div class="form-group"><label>Titre</label><input type="text" id="cmp-title" required></div>
        <div class="form-group">
          <label>Catégorie</label>
          <select id="cmp-category" required>
            <option value="Technique">Technique</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Facturation">Facturation</option>
            <option value="Installation">Installation</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div class="form-group">
          <label>Priorité</label>
          <select id="cmp-priority" required>
            <option value="Faible">Faible</option>
            <option value="Normale" selected>Normale</option>
            <option value="Haute">Haute</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
        <div class="form-group"><label>Description</label><textarea id="cmp-description" required></textarea></div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:1rem;">
          <button type="button" id="btn-close-complaint-modal" class="btn btn-secondary">Annuler</button>
          <button type="submit" class="btn btn-primary">Créer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/complaints.js"></script>
</body>
</html>
