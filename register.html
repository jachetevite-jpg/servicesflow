<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte entreprise - ServiceFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo" style="justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          ServiceFlow
        </div>
        <h2>Inscrire votre entreprise</h2>
        <p>Commencez à gérer vos services en quelques clics</p>
      </div>

      <div id="alert-container"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="companyName">Nom de l'entreprise</label>
          <input type="text" id="companyName" class="form-control" placeholder="Ex: TechServices SARL" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" class="form-control" placeholder="Jean" required>
          </div>
          <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" class="form-control" placeholder="Dupont" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email professionnel</label>
            <input type="email" id="email" class="form-control" placeholder="jean@entreprise.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Téléphone</label>
            <input type="tel" id="phone" class="form-control" placeholder="+33 6 00 00 00 00" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" class="form-control" placeholder="Au moins 8 caractères" minlength="8" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirmer le mot de passe" required>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%;">
          Créer mon compte
        </button>
      </form>

      <div class="auth-footer">
        Déjà un compte ? <a href="login.html">Se connecter</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
