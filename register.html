<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - ServicesFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- SDK Appwrite v14 -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body>
  <div class="auth-container">
    <h2>Créer un compte</h2>
    <p class="text-muted" style="margin-bottom: 1.5rem;">Rejoignez ServicesFlow</p>
    
    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" class="form-control" required placeholder="Jean Dupont">
      </div>
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" class="form-control" required placeholder="nom@exemple.com">
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" class="form-control" required placeholder="•••••••• (min. 8 caractères)">
      </div>
      <button type="submit" id="btn-submit" class="btn btn-primary btn-block">S'inscrire</button>
    </form>

    <p style="margin-top: 1rem; text-align: center;" class="text-muted">
      Déjà inscrit ? <a href="login.html">Se connecter</a>
    </p>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = "Inscription en cours...";

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await Auth.register(email, password, name);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "S'inscrire";
      }
    }
  </script>
</body>
</html>
