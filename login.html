<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - ServicesFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
  <style>
    /* Correctif CSS explicite pour éviter l'affichage tronqué */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
    }
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .auth-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
    }
    .auth-card h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: #0f172a;
      text-align: center;
    }
    .auth-card p {
      color: #64748b;
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 500;
      color: #334155;
      font-size: 0.875rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .form-control:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background-color: #1d4ed8;
    }
    .auth-error {
      color: #ef4444;
      background: #fef2f2;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>ServicesFlow</h2>
      <p>Connectez-vous à votre espace administration</p>

      <div id="auth-error-msg" class="auth-error"></div>

      <form id="form-login">
        <div class="form-group">
          <label for="login-email">Adresse Email</label>
          <input type="email" id="login-email" class="form-control" required placeholder="nom@exemple.com">
        </div>

        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" id="btn-login-submit" class="btn-submit">Se connecter</button>
      </form>
    </div>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Gestion de la soumission du formulaire de connexion
    document.getElementById('form-login')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('auth-error-msg');
      const submitBtn = document.getElementById('btn-login-submit');

      errorDiv.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Connexion en cours...';

      try {
        // Supprimer toute ancienne session résiduelle avant de se connecter
        try { await AppwriteConfig.account.deleteSession('current'); } catch(err) {}

        // Créer la nouvelle session Appwrite
        await AppwriteConfig.account.createEmailPasswordSession(email, password);
        
        // Rediriger directement vers le dashboard
        window.location.href = '/dashboard.html';
      } catch (error) {
        console.error("Erreur de connexion:", error);
        errorDiv.textContent = "Échec de connexion : Veuillez vérifier vos identifiants.";
        errorDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
