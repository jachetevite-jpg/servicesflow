<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - ServicesFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
</head>
<body>
  <div class="auth-container">
    <h2>Connexion</h2>
    <p class="text-muted" style="margin-bottom: 1.5rem;">Connectez-vous à ServicesFlow</p>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" class="form-control" required placeholder="nom@exemple.com">
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
    
    <p style="margin-top: 1rem; text-align: center;" class="text-muted">
      Pas encore de compte ? <a href="register.html">Créer un compte</a>
    </p>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        await Auth.login(email, password);
      } catch (err) {
        alert('Erreur de connexion : Vérifiez vos identifiants.');
      }
    });
  </script>
</body>
</html>
