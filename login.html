<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - ServiceFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <h2>ServiceFlow</h2>
      <p>Connexion à votre espace</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nom@entreprise.com">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>

    <div class="auth-footer">
      <p><a href="forgot-password.html">Mot de passe oublié ?</a></p>
      <p style="margin-top: 10px;">Pas encore de compte ? <a href="register.html">Inscrire votre entreprise</a></p>
    </div>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      await Auth.login(email, password);
    });
  </script>
</body>
</html>
