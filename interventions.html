<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interventions - ServicesFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>ServicesFlow</h2>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html">Tableau de bord</a>
        <a href="clients.html">Clients</a>
        <a href="complaints.html">Réclamations</a>
        <a href="interventions.html" class="active">Interventions</a>
        <a href="notifications.html">Notifications</a>
        <a href="activity-logs.html">Journal d'activité</a>
      </nav>
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-danger btn-block">Déconnexion</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Gestion des Interventions</h1>
        <button id="btn-refresh-interventions" class="btn btn-secondary">Actualiser</button>
      </header>

      <section class="section-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Titre / Description</th>
                <th>Statut</th>
                <th>Technicien / Agent</th>
                <th>Date Prévue</th>
                <th>Créée le</th>
              </tr>
            </thead>
            <tbody id="interventions-table-body">
              <tr><td colspan="5">Chargement des interventions...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/interventions.js"></script>
<!-- Modal Ajout Intervention -->
<div id="modal-intervention" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Nouvelle Intervention</h3>
      <button class="modal-close" onclick="closeModal('modal-intervention')">&times;</button>
    </div>
    <form id="form-add-intervention">
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="intervention-title">Titre / Intitulé *</label>
        <input type="text" id="intervention-title" class="form-control" required placeholder="ex: Maintenance serveur">
      </div>
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="intervention-description">Description</label>
        <textarea id="intervention-description" class="form-control" rows="3" placeholder="Détails du problème ou de l'intervention"></textarea>
      </div>
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="intervention-technician">Technicien / Agent Assigné</label>
        <input type="text" id="intervention-technician" class="form-control" placeholder="Nom du technicien">
      </div>
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="intervention-status">Statut *</label>
        <select id="intervention-status" class="form-control" required>
          <option value="pending">En attente</option>
          <option value="in_progress">En cours</option>
          <option value="completed">Terminée</option>
          <option value="cancelled">Annulée</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="intervention-date">Date Prévue</label>
        <input type="datetime-local" id="intervention-date" class="form-control">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modal-intervention')">Annuler</button>
        <button type="submit" id="btn-save-intervention" class="btn btn-primary">Créer</button>
	<button id="btn-open-intervention-modal" class="btn btn-primary">+ Nouvelle Intervention</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
