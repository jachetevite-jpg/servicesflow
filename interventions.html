<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interventions - ServiceFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>ServiceFlow</h2>
        <span id="company-display-name" style="font-size:0.75rem; color:#94a3b8;">Chargement...</span>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html">Tableau de bord</a>
        <a href="clients.html">Clients</a>
        <a href="complaints.html">Réclamations</a>
        <a href="interventions.html" class="active">Interventions</a>
        <a href="technicians.html">Techniciens</a>
        <a href="notifications.html">Notifications</a>
        <a href="settings.html">Paramètres</a>
      </nav>
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-danger btn-block">Déconnexion</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Gestion des Interventions</h1>
        <button id="btn-open-modal-intervention" class="btn btn-primary">+ Programmer Intervention</button>
      </header>

      <section class="section-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date & Heure</th>
                <th>Client</th>
                <th>Technicien</th>
                <th>Priorité</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="interventions-table-body">
              <tr><td colspan="6">Chargement...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-intervention" class="modal-backdrop" style="display:none;">
    <div class="modal-content">
      <h2>Programmer une Intervention</h2>
      <form id="form-intervention" style="margin-top:1rem;">
        <div class="form-group">
          <label for="int-clientId">Client *</label>
          <select id="int-clientId" required><option value="">Sélectionner un client...</option></select>
        </div>
        <div class="form-group">
          <label for="int-complaintId">Réclamation associée (optionnel)</label>
          <select id="int-complaintId"><option value="">Aucune réclamation</option></select>
        </div>
        <div class="form-group">
          <label for="int-technicianId">Technicien *</label>
          <select id="int-technicianId" required><option value="">Sélectionner un technicien...</option></select>
        </div>
        <div class="form-row" style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label for="int-date">Date prévue *</label>
            <input type="date" id="int-date" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label for="int-time">Heure prévue *</label>
            <input type="time" id="int-time" required>
          </div>
        </div>
        <div class="form-group">
          <label for="int-priority">Priorité *</label>
          <select id="int-priority" required>
            <option value="Faible">Faible</option>
            <option value="Normale" selected>Normale</option>
            <option value="Haute">Haute</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
        <div class="form-group">
          <label for="int-description">Problème / Description *</label>
          <textarea id="int-description" required></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:1rem;">
          <button type="button" id="btn-close-intervention-modal" class="btn btn-secondary">Annuler</button>
          <button type="submit" class="btn btn-primary">Programmer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/interventions.js"></script>
</body>
</html>
