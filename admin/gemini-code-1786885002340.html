<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - Tableau de bord</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" style="background:#0f172a;">
      <div class="sidebar-brand">
        <h2 style="color:#f8fafc;">ServiceFlow</h2>
        <span style="font-size:0.75rem; color:#f59e0b; font-weight:bold;">SUPER ADMIN</span>
      </div>
      <nav class="sidebar-menu">
        <a href="index.html" class="active">Vue globale</a>
        <a href="companies.html">Entreprises</a>
        <a href="subscriptions.html">Abonnements</a>
        <a href="users.html">Utilisateurs Globaux</a>
      </nav>
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-danger btn-block">Déconnexion</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Supervision de la Plateforme</h1>
      </header>

      <section style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:1.5rem; margin-bottom:2rem;">
        <div class="section-card" style="border-top: 4px solid #3b82f6;">
          <span style="font-size:0.85rem; color:var(--text-muted);">Entreprises Totales</span>
          <h2 id="stat-companies" style="font-size:2rem; margin-top:0.5rem;">0</h2>
        </div>
        <div class="section-card" style="border-top: 4px solid #10b981;">
          <span style="font-size:0.85rem; color:var(--text-muted);">Abonnements Actifs</span>
          <h2 id="stat-active-subs" style="font-size:2rem; margin-top:0.5rem;">0</h2>
        </div>
        <div class="section-card" style="border-top: 4px solid #8b5cf6;">
          <span style="font-size:0.85rem; color:var(--text-muted);">Utilisateurs Totaux</span>
          <h2 id="stat-users" style="font-size:2rem; margin-top:0.5rem;">0</h2>
        </div>
      </section>

      <section class="section-card">
        <h2>Dernières Entreprises Inscrites</h2>
        <div class="table-responsive" style="margin-top:1rem;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Entreprise</th>
                <th>Secteur</th>
                <th>Statut</th>
                <th>Inscrite le</th>
              </tr>
            </thead>
            <tbody id="recent-companies-body">
              <tr><td colspan="4">Chargement...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/appwrite.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/auth.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
