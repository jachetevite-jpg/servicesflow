<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - Abonnements SaaS</title>
  <link rel="stylesheet" href="../css/style.css">

<body>
  <div class="app-container">
