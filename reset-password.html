<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe - ServiceFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo" style="justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          ServiceFlow
        </div>
        <h2>Définir un nouveau mot de passe</h2>
        <p>Saisissez votre nouveau mot de passe sécurisé</p>
      </div>

      <div id="alert-container"></div>

      <form id="reset-password-form">
        <div class="form-group">
          <label for="password">Nouveau mot de passe</label>
          <input type="password" id="password" class="form-control" placeholder="Au moins 8 caractères" minlength="8" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirmer le mot de passe" required>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%;">
          Mettre à jour le mot de passe
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html">← Annuler et se connecter</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
