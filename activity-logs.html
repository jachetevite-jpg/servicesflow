<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal d'activité - ServiceFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tables.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>ServiceFlow</h2>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html">Tableau de bord</a>
        <a href="clients.html">Clients</a>
        <a href="complaints.html">Réclamations</a>
        <a href="interventions.html">Interventions</a>
        <a href="technicians.html">Techniciens</a>
        <a href="notifications.html">Notifications</a>
        <a href="activity-logs.html" class="active">Journal d'activité</a>
        <a href="settings.html">Paramètres</a>
      </nav>
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-danger btn-block">Déconnexion</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Journal d'activité & Audit</h1>
      </header>

      <section class="section-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date & Heure</th>
                <th>Auteur</th>
                <th>Action</th>
                <th>Entité</th>
                <th>Détails</th>
              </tr>
            </thead>
            <tbody id="logs-table-body">
              <tr><td colspan="5">Chargement du journal...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/appwrite.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/activity-logs.js"></script>
</body>
</html>
